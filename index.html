<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Radio Nest Ultra Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #fff;
      --subtext: rgba(255,255,255,0.7);
      --glass: rgba(0,0,0,0.25);
      --title-color: #fff;
      --slider-track: linear-gradient(90deg, #ffffff 0%, #d0d0d0 100%);
      --slider-thumb: #ffffff;
      --slider-thumb-glow: rgba(255,255,255,0.6);
    }

    .theme-dark {
      --text: #000;
      --subtext: rgba(0,0,0,0.7);
      --glass: rgba(0,0,0,0.18);
      --title-color: #004a99;
      --slider-track: linear-gradient(90deg, #333 0%, #777 100%);
      --slider-thumb: #000;
      --slider-thumb-glow: rgba(0,0,0,0.4);
    }

    .theme-light {
      --text: #fff;
      --subtext: rgba(255,255,255,0.7);
      --glass: rgba(255,255,255,0.06);
      --title-color: #1a76c8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Montserrat", system-ui, sans-serif;
      background: transparent;
      overflow: hidden;
      height: 100vh;
      color: var(--text);
    }

    .glass-bg {
      position: fixed;
      inset: 0;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: var(--glass);
      z-index: 1;
      pointer-events: none;
      border-radius: 12px;
      overflow: hidden;
    }

    @supports not ((backdrop-filter: blur(12px)) or (-webkit-backdrop-filter: blur(12px))) {
      .glass-bg {
        background: rgba(0, 0, 0, 0.6);
      }
    }

    .page-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 20px 40px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .masthead {
      margin-bottom: 20px;
      text-align: left;
    }

    .masthead-title {
      font-size: 17px;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      color: var(--title-color) !important;
    }

    .masthead-sub {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--subtext);
    }

    .player-layout {
      display: flex;
      flex-direction: row;
      gap: 40px;
      align-items: flex-start;
      width: 100%;
    }

    .art-wrap {
      flex: 0 0 400px;
      position: relative;
      box-shadow: 0 22px 40px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
      width: 400px;
      height: 400px;
    }

    @supports (aspect-ratio: 1 / 1) {
      .art-wrap {
        width: auto;
        height: auto;
        aspect-ratio: 1 / 1;
      }
    }

    .art-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .art-img.fade {
      opacity: 0;
    }

    .fallback-chip {
      position: absolute;
      left: 10px;
      bottom: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: rgba(0,0,0,0.5);
      color: #fff;
      display: none;
    }

    .meta-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      text-align: left;
      align-items: flex-start;
      overflow: hidden;
    }

    .onair-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.28em;
      margin-bottom: 10px;
      text-transform: uppercase;
      color: var(--text);
    }

    .onair-label span {
      color: #ff9c35;
    }

    .track-title {
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: var(--text);
      white-space: normal;
      overflow: visible;
      word-break: break-word;
    }

    .track-sub {
      font-size: 14px;
      color: var(--subtext);
      margin-bottom: 18px;
    }

    .play-btn {
      width: 140px;
      height: 42px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: #fff;
      color: #000;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
      margin-bottom: 15px;
    }

    .volume-wrap {
      width: 220px;
    }

    /* Updated, cross-browser, theme-aware volume slider */
    .volume-bar {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      cursor: pointer;
      background: var(--slider-track);
      outline: none;
      border: none;
      -webkit-appearance: none;
      appearance: none;
    }

    /* WebKit (Chrome, Edge, Safari) track */
    .volume-bar::-webkit-slider-runnable-track {
      background: var(--slider-track);
      height: 6px;
      border-radius: 999px;
    }

    /* WebKit thumb */
    .volume-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--slider-thumb);
      border: none;
      margin-top: -4px; /* centres thumb on 6px track */
      box-shadow: 0 0 0 0 transparent;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    .volume-bar::-webkit-slider-thumb:hover {
      box-shadow: 0 0 0 6px var(--slider-thumb-glow);
      transform: scale(1.05);
    }

    /* Firefox track */
    .volume-bar::-moz-range-track {
      background: var(--slider-track);
      height: 6px;
      border-radius: 999px;
    }

    /* Firefox thumb */
    .volume-bar::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--slider-thumb);
      border: none;
      box-shadow: 0 0 0 0 transparent;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    .volume-bar::-moz-range-thumb:hover {
      box-shadow: 0 0 0 6px var(--slider-thumb-glow);
      transform: scale(1.05);
    }

    @media (max-width: 1024px) {
      .page-wrap { padding: 20px; }
      .masthead { text-align: center; }
      .masthead-title { margin: 0 auto; }
      .masthead-sub { text-align: center; }

      .player-layout {
        flex-direction: column;
        align-items: center;
        gap: 25px;
      }

      .meta-wrap {
        text-align: center;
        align-items: center;
        width: 100%;
        max-width: 500px;
      }

      .onair-label { order: 1; }
      .track-title { order: 2; }
      .track-sub   { order: 3; }
      .play-btn    { order: 4; }
      .art-wrap    { order: 5; }

      .art-wrap {
        width: 100%;
        max-width: 350px;
        height: auto;
      }

      .volume-wrap { display: none; }
    }
  </style>
</head>

<body>

  <div class="glass-bg"></div>

  <div class="page-wrap">

    <div class="masthead">
      <button class="masthead-title" onclick="window.open('https://myradionest.com', '_blank')">
        RADIO NEST ULTRA PLAYER
      </button>
    </div>

    <div id="playerArea" class="player-layout">

      <div class="art-wrap">
        <img id="artwork" class="art-img" src="" alt="">
        <div id="fallbackChip" class="fallback-chip">NO ARTWORK</div>
      </div>

      <div class="meta-wrap">
        <div class="onair-label"><span>●</span> NOW PLAYING</div>

        <div id="trackTitle" class="track-title">Loading…</div>
        <div id="trackSub" class="track-sub"></div>

        <button id="playButton" class="play-btn">PLAY</button>

        <div class="volume-wrap">
          <input id="volumeBar" class="volume-bar" type="range" min="0" max="100" value="100">
        </div>
      </div>

    </div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const streamURL = params.get("stream");
const metaURL = params.get("meta");
const licenseKey = params.get("license");

const licenseURL = "https://raw.githubusercontent.com/radionest01/radio-nest-ultra-radio-player/main/licenses.json";

async function checkLicense() {
  try {
    const res = await fetch(licenseURL + "?_=" + Date.now());
    const data = await res.json();

    if (!data.licenses || !Array.isArray(data.licenses)) {
      return showInvalid("data");
    }

    const license = data.licenses.find(l => l.key === licenseKey);

    if (!license) return showInvalid("invalid");

    if (license.expires !== "never") {
      const today = new Date();
      const expiry = new Date(license.expires);
      if (today > expiry) return showInvalid("expired");
    }

    return true;

  } catch {
    return showInvalid("data");
  }
}

function showInvalid(reason) {
  let title = "";
  let message = "";

  if (reason === "expired") {
    title = "License Expired";
    message = `The license for the Radio Nest Ultra Player has expired. Renew your licence at 
      <a href="https://myradionest.com" target="_blank" style="color:#4da3ff;">myradionest.com</a>.`;
  } else {
    title = "Invalid License";
    message = "This Radio Nest Ultra Player is not licensed.";
  }

  document.getElementById("playerArea").innerHTML = `
    <div style="width:100%;text-align:center;padding:40px 20px;color:#fff;">
      <h1 style="font-size:32px;margin-bottom:10px;">${title}</h1>
      <p style="font-size:16px;opacity:0.7;">${message}</p>
    </div>
  `;

  return false;
}

function applyTheme(theme) {
  document.body.classList.remove("theme-light", "theme-dark");
  const t = (theme || "").toLowerCase();
  if (t === "light") document.body.classList.add("theme-light");
  else document.body.classList.add("theme-dark");
}

document.addEventListener("DOMContentLoaded", () => {
  applyTheme(params.get("theme"));
  window.addEventListener("message", (event) => {
    if (event.data && event.data.theme) applyTheme(event.data.theme);
  });
});

let audio;
let playButton;
let volumeBar;
let titleEl;
let subEl;
let artworkEl;
let fallbackChip;

const FALLBACK_ART = "https://i.ibb.co/Jj588RKm/Live-Stream-Default-Album-Art.png";

function initPlayer() {
  audio = new Audio();
  audio.src = streamURL;
  audio.preload = "none";
  audio.crossOrigin = "anonymous";

  playButton = document.getElementById("playButton");
  volumeBar  = document.getElementById("volumeBar");
  titleEl    = document.getElementById("trackTitle");
  subEl      = document.getElementById("trackSub");
  artworkEl  = document.getElementById("artwork");
  fallbackChip = document.getElementById("fallbackChip");

  playButton.addEventListener("click", () => {
    if (audio.paused) {
      audio.play();
      playButton.textContent = "STOP";
    } else {
      audio.pause();
      playButton.textContent = "PLAY";
    }
  });

  audio.volume = volumeBar ? volumeBar.value / 100 : 1.0;

  if (volumeBar) {
    volumeBar.addEventListener("input", () => {
      audio.volume = volumeBar.value / 100;
    });
  }

  if (metaURL) {
    fetchMetadata();
    setInterval(fetchMetadata, 5000);
  } else {
    applyFallbackMetadata();
  }
}

function applyFallbackMetadata() {
  titleEl.textContent = "Live Stream";
  subEl.textContent = "";
  showFallback();
}

function showFallback() {
  if (artworkEl.src !== FALLBACK_ART) {
    artworkEl.classList.add("fade");
    setTimeout(() => {
      artworkEl.src = FALLBACK_ART;
      artworkEl.classList.remove("fade");
    }, 200);
  }
  fallbackChip.style.display = "none";
}

async function fetchMetadata() {
  try {
    const res = await fetch(metaURL + "?_=" + Date.now());
    const data = await res.json();

    let source = data.icestats && data.icestats.source;
    if (Array.isArray(source)) source = source[0];
    source = source || {};

    let raw = source.title || "";

    if (!raw.trim()) {
      applyFallbackMetadata();
      return;
    }

    titleEl.textContent = raw.trim();
    subEl.textContent = "";

    updateArtwork(raw.trim(), "");

  } catch {
    applyFallbackMetadata();
  }
}

async function updateArtwork(title, artist) {
  const query = encodeURIComponent(title.trim());

  if (!query) {
    showFallback();
    return;
  }

  try {
    const res = await fetch(
      `https://itunes.apple.com/search?term=${query}&entity=song&limit=1`
    );
    const data = await res.json();

    if (data.results && data.results.length > 0) {
      let art = data.results[0].artworkUrl100;
      art = art.replace("100x100bb.jpg", "1200x1200bb.jpg");

      if (artworkEl.src !== art) {
        artworkEl.classList.add("fade");
        setTimeout(() => {
          artworkEl.src = art;
          artworkEl.classList.remove("fade");
        }, 200);
      }

      fallbackChip.style.display = "none";
    } else {
      showFallback();
    }
  } catch {
    showFallback();
  }
}

checkLicense().then(valid => {
  if (valid) initPlayer();
});
</script>

</body>
</html>
