<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio Nest Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg-color: #141218;
      --card-bg: rgba(20, 18, 24, 0.9);
      --accent: #2f80ed;
      --text-main: #ffffff;
      --text-subtle: #d0cdd7;
      --muted: #8f8d99;
      --danger: #ff4b5c;
      --success: #32d48e;
      --border-soft: rgba(255, 255, 255, 0.08);
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top left, #50317e, #141218 55%, #05030a);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }

    .player-shell {
      width: 100%;
      max-width: 640px;
      background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.06),
          rgba(0, 0, 0, 0.75)
        ),
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.05), transparent);
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 16px 16px;
      backdrop-filter: blur(20px);
    }

    .player-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 12px;
    }

    .brand-link {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
      white-space: nowrap;
    }

    .brand-link:focus,
    .brand-link:hover {
      text-decoration-thickness: 2px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px 3px 4px;
      border-radius: 999px;
      background: rgba(50, 212, 142, 0.08);
      border: 1px solid rgba(50, 212, 142, 0.4);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-subtle);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px rgba(50, 212, 142, 0.8);
      animation: pulse-dot 1.8s infinite;
    }

    @keyframes pulse-dot {
      0% {
        transform: scale(0.95);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
      100% {
        transform: scale(0.95);
        opacity: 0.9;
      }
    }

    .player-main {
      display: grid;
      grid-template-columns: 1.1fr 1.6fr;
      gap: 14px;
    }

    .art-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: radial-gradient(circle at top, #4b296d, #040308);
      border: 1px solid rgba(255, 255, 255, 0.08);
      aspect-ratio: 1 / 1;
    }

    .art-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .art-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.65),
        rgba(0, 0, 0, 0.1) 40%,
        transparent
      );
      pointer-events: none;
    }

    .fallback-tag {
      position: absolute;
      left: 8px;
      bottom: 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--muted);
    }

    .player-right {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .track-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 2px;
      min-height: 1.2em;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-subtle);
      margin-bottom: 6px;
      min-height: 1em;
    }

    .fallback-text {
      font-size: 11px;
      color: var(--muted);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .play-button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 20%, #ffffff, #2f80ed);
      color: #000000;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
    }

    .play-button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
      filter: brightness(0.96);
    }

    .play-icon {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 7px 0 7px 12px;
      border-color: transparent transparent transparent #000000;
      margin-left: 2px;
    }

    .pause-icon {
      display: flex;
      gap: 3px;
    }

    .pause-bar {
      width: 3px;
      height: 14px;
      border-radius: 999px;
      background: #000000;
    }

    .volume-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume-icon {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-subtle);
      flex-shrink: 0;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.35);
      margin-top: -5px;
    }

    .volume-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.35);
    }

    .volume-slider::-moz-range-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
    }

    .meta-footer {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--muted);
      gap: 8px;
    }

    .meta-source {
      opacity: 0.85;
    }

    .meta-refresh {
      font-variant-numeric: tabular-nums;
    }

    .error-text {
      color: var(--danger);
    }

    @media (max-width: 560px) {
      .player-main {
        grid-template-columns: 1fr;
      }

      .art-wrap {
        max-width: 260px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="player-shell">
    <div class="player-header">
      <button
        class="brand-link"
        onclick="window.open('https://myradionest.com','_blank')"
      >
        Radio Nest Player
      </button>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>On Air</span>
      </div>
    </div>

    <div class="player-main">
      <div class="art-wrap">
        <img
          id="albumArt"
          class="art-image"
          src="https://i.ibb.co/KpygTpfk/Online-Radio-Album-Art-Fall-Back-1.png"
          alt="Album art"
        />
        <div class="art-overlay"></div>
        <div id="fallbackTag" class="fallback-tag">Radio - Live Stream</div>
      </div>

      <div class="player-right">
        <div>
          <div class="section-label">Now Playing</div>
          <div id="trackTitle" class="track-title">Loading...</div>
          <div id="trackArtist" class="track-artist"></div>
          <div id="fallbackText" class="fallback-text">
            Radio - Live Stream
          </div>
        </div>

        <div class="controls-row">
          <button id="playPauseBtn" class="play-button" type="button">
            <div class="play-icon" id="playIcon"></div>
          </button>

          <div class="volume-wrap">
            <div class="volume-icon">
              <!-- simple speaker icon -->
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                aria-hidden="true"
              >
                <path
                  fill="currentColor"
                  d="M4 9v6h3l4 4V5L7 9H4zm10.54-4.46L13.83 6.3A4.978 4.978 0 0 1 16 9c0 1.3-.5 2.55-1.46 3.46l.71 1.76A6.96 6.96 0 0 0 18 9a6.96 6.96 0 0 0-3.46-4.46z"
                ></path>
              </svg>
            </div>
            <input
              id="volumeSlider"
              class="volume-slider"
              type="range"
              min="0"
              max="100"
              value="100"
            />
          </div>
        </div>

        <div class="meta-footer">
          <span class="meta-source">Artwork via iTunes Search API</span>
          <span id="metaStatus" class="meta-refresh">Updating every 15s</span>
        </div>
      </div>
    </div>
  </div>

  <audio id="audioElement"></audio>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);

      const streamUrl = urlParams.get("stream") || "";
      const metaUrl = urlParams.get("meta") || "";
      const refreshIntervalMs = 15000; // 15 seconds

      const audioEl = document.getElementById("audioElement");
      const playPauseBtn = document.getElementById("playPauseBtn");
      const playIcon = document.getElementById("playIcon");
      const volumeSlider = document.getElementById("volumeSlider");
      const albumArt = document.getElementById("albumArt");
      const trackTitleEl = document.getElementById("trackTitle");
      const trackArtistEl = document.getElementById("trackArtist");
      const fallbackTextEl = document.getElementById("fallbackText");
      const fallbackTagEl = document.getElementById("fallbackTag");
      const metaStatusEl = document.getElementById("metaStatus");

      const FALLBACK_ART =
        "https://i.ibb.co/KpygTpfk/Online-Radio-Album-Art-Fall-Back-1.png";

      function setPlayIcon(isPlaying) {
        playIcon.innerHTML = "";
        if (isPlaying) {
          const pause = document.createElement("div");
          pause.className = "pause-icon";
          const bar1 = document.createElement("div");
          bar1.className = "pause-bar";
          const bar2 = document.createElement("div");
          bar2.className = "pause-bar";
          pause.appendChild(bar1);
          pause.appendChild(bar2);
          playIcon.appendChild(pause);
        } else {
          const tri = document.createElement("div");
          tri.className = "play-icon";
          playIcon.appendChild(tri);
        }
      }

      // Initialize audio
      if (streamUrl) {
        audioEl.src = streamUrl;
      }
      // Default volume 100%
      audioEl.volume = 1.0;
      volumeSlider.value = 100;

      // Play / Pause
      playPauseBtn.addEventListener("click", () => {
        if (!audioEl.src) return;
        if (audioEl.paused) {
          audioEl
            .play()
            .then(() => setPlayIcon(true))
            .catch((err) => {
              console.error("Playback error:", err);
            });
        } else {
          audioEl.pause();
          setPlayIcon(false);
        }
      });

      audioEl.addEventListener("play", () => setPlayIcon(true));
      audioEl.addEventListener("pause", () => setPlayIcon(false));

      // Volume handling
      volumeSlider.addEventListener("input", () => {
        const value = Number(volumeSlider.value || 0);
        audioEl.volume = Math.min(Math.max(value / 100, 0), 1);
      });

      // Metadata + artwork
      async function fetchMetadata() {
        if (!metaUrl) {
          metaStatusEl.textContent = "No metadata source configured";
          metaStatusEl.classList.add("error-text");
          return;
        }

        metaStatusEl.textContent = "Updating...";
        metaStatusEl.classList.remove("error-text");

        try {
          const response = await fetch(metaUrl, { cache: "no-store" });
          if (!response.ok) {
            throw new Error("Metadata HTTP " + response.status);
          }

          const data = await response.json();

          const artist = (data.artist || "").toString().trim();
          const title = (data.title || "").toString().trim();

          if (!artist && !title) {
            trackTitleEl.textContent = "Radio - Live Stream";
            trackArtistEl.textContent = "";
            fallbackTextEl.textContent = "Radio - Live Stream";
            albumArt.src = FALLBACK_ART;
            if (fallbackTagEl) fallbackTagEl.style.display = "inline-flex";
            metaStatusEl.textContent = "No track info in metadata";
            return;
          }

          trackTitleEl.textContent = title || "Radio - Live Stream";
          trackArtistEl.textContent = artist || "";
          fallbackTextEl.textContent = "Radio - Live Stream";

          if (fallbackTagEl) fallbackTagEl.style.display = "none";

          await updateArtworkFromItunes(artist, title);
          metaStatusEl.textContent = "Updated just now";
        } catch (err) {
          console.error("Metadata error:", err);
          metaStatusEl.textContent = "Metadata error";
          metaStatusEl.classList.add("error-text");
          // Fallback visuals
          trackTitleEl.textContent ||= "Radio - Live Stream";
          albumArt.src = FALLBACK_ART;
          if (fallbackTagEl) fallbackTagEl.style.display = "inline-flex";
        }
      }

      async function updateArtworkFromItunes(artist, title) {
        const query = encodeURIComponent(`${artist} ${title}`.trim());
        if (!query) {
          albumArt.src = FALLBACK_ART;
          if (fallbackTagEl) fallbackTagEl.style.display = "inline-flex";
          return;
        }

        const url = `https://itunes.apple.com/search?media=music&limit=1&term=${query}`;

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error("iTunes HTTP " + response.status);
          const json = await response.json();

          if (!json.results || !json.results.length) {
            albumArt.src = FALLBACK_ART;
            if (fallbackTagEl) fallbackTagEl.style.display = "inline-flex";
            return;
          }

          const artUrl = json.results[0].artworkUrl100 || json.results[0].artworkUrl60;
          if (!artUrl) {
            albumArt.src = FALLBACK_ART;
            if (fallbackTagEl) fallbackTagEl.style.display = "inline-flex";
            return;
          }

          const highRes = artUrl.replace(/100x100bb\.jpg|60x60bb\.jpg/, "300x300bb.jpg");
          albumArt.src = highRes;
          if (fallbackTagEl) fallbackTagEl.style.display = "none";
        } catch (err) {
          console.error("iTunes artwork error:", err);
          albumArt.src = FALLBACK_ART;
          if (fallbackTagEl) fallbackTagEl.style.display = "inline-flex";
        }
      }

      // Start metadata polling
      if (metaUrl) {
        fetchMetadata();
        setInterval(fetchMetadata, refreshIntervalMs);
      } else {
        metaStatusEl.textContent = "No metadata source configured";
        metaStatusEl.classList.add("error-text");
      }

      // Initial play icon state
      setPlayIcon(false);
    })();
  </script>
</body>
</html>
