<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Nest Ultra Radio Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(120deg, #c8a38a, #5b3422);
      color: #fff;
    }

    .player {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
      align-items: center;
    }

    .artwork {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
    }

    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .meta small {
      display: inline-block;
      background: #ff4d00;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .meta h1 {
      font-size: 28px;
      margin: 0;
      font-weight: 700;
    }

    .meta h2 {
      font-size: 16px;
      margin: 6px 0 20px;
      font-weight: 400;
      opacity: 0.9;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    button {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
    }

    input[type=range] {
      flex: 1;
    }

    @media (max-width: 700px) {
      .player {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="player">
  <div class="artwork">
    <img id="artwork" src="https://via.placeholder.com/600" />
  </div>

  <div class="meta">
    <small>ON AIR</small>
    <h1 id="title">Radio Nest Ultra</h1>
    <h2 id="artist">Live Stream</h2>

    <div class="controls">
      <button id="play">Play</button>
      <input type="range" min="0" max="1" step="0.01" value="1" id="volume" />
    </div>
  </div>
</div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
  const params = new URLSearchParams(window.location.search);
  const streamUrl = params.get('stream');
  const metaUrl = params.get('meta');

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('play');
  const volume = document.getElementById('volume');
  const title = document.getElementById('title');
  const artist = document.getElementById('artist');
  const artwork = document.getElementById('artwork');

  if (streamUrl) audio.src = streamUrl;

  playBtn.onclick = () => {
    if (audio.paused) {
      audio.play();
      playBtn.textContent = 'Pause';
    } else {
      audio.pause();
      playBtn.textContent = 'Play';
    }
  };

  volume.oninput = e => audio.volume = e.target.value;

  async function updateMeta() {
    if (!metaUrl) return;

    try {
      const res = await fetch(metaUrl);
      const data = await res.json();

      title.textContent = data.title || 'Live Stream';
      artist.textContent = data.artist || '';

      const term = encodeURIComponent(`${data.artist} ${data.title}`);
      const itunes = await fetch(`https://itunes.apple.com/search?term=${term}&media=music&limit=1`);
      const itunesData = await itunes.json();

      if (itunesData.results.length) {
        artwork.src = itunesData.results[0].artworkUrl100.replace('100x100', '600x600');
      }
    } catch (e) {
      console.warn('Metadata error', e);
    }
  }

  updateMeta();
  setInterval(updateMeta, 15000);
</script>

</body>
</html>
