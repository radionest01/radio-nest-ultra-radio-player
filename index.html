<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Radio Nest Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #fff;
      --subtext: rgba(255,255,255,0.7);
      --glass: rgba(0,0,0,0.25);
    }

    .theme-light {
      --text: #000;
      --subtext: rgba(0,0,0,0.7);
      --glass: rgba(255,255,255,0.08);
    }

    .theme-dark {
      --text: #fff;
      --subtext: rgba(255,255,255,0.7);
      --glass: rgba(0,0,0,0.25);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Montserrat", system-ui, sans-serif;
      background: transparent;
      overflow: hidden;
      height: 100vh;
      color: var(--text);
    }

    .glass-bg {
      position: fixed;
      inset: 0;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      background: var(--glass);
      z-index: 1;
      pointer-events: none;
    }

    .page-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 50px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .masthead {
      margin-bottom: 20px;
    }

    .masthead-title {
      font-size: 17px;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
    }

    .masthead-sub {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--subtext);
    }

    .player-layout {
      display: flex;
      gap: 40px;
      align-items: center;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    .art-wrap {
      flex: 0 0 400px;
      aspect-ratio: 1/1;
      overflow: hidden;
      position: relative;
      box-shadow: 0 22px 40px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .art-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fallback-chip {
      position: absolute;
      left: 10px;
      bottom: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: rgba(0,0,0,0.5);
      color: #fff;
      display: none;
    }

    .theme-light .fallback-chip {
      background: rgba(255,255,255,0.5);
      color: #000;
    }

    .meta-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .onair-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      margin-bottom: 8px;
      color: var(--subtext);
    }

    .onair-label span {
      color: #ff9c35;
    }

    .track-title {
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: clamp(14px, 2vw, 16px);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      margin-bottom: 10px;
      color: var(--subtext);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-sub {
      font-size: 14px;
      color: var(--subtext);
      margin-bottom: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .play-btn {
      width: 140px;
      height: 42px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: #fff;
      color: #000;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    }

    .volume-wrap {
      width: 200px;
    }

    .volume-bar {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      background: var(--subtext);
    }

    .volume-bar::-webkit-slider-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      -webkit-appearance: none;
      appearance: none;
    }
  </style>
</head>

<body>

  <div class="glass-bg"></div>

  <div class="page-wrap">

    <div class="masthead">
      <button class="masthead-title" onclick="location.reload()">RADIO NEST PLAYER</button>
      <div class="masthead-sub">UNIVERSAL EMBEDDED LISTENING EXPERIENCE</div>
    </div>

    <div class="player-layout">

      <div class="art-wrap">
        <img id="artwork" class="art-img" src="" alt="">
        <div id="fallbackChip" class="fallback-chip">NO ARTWORK</div>
      </div>

      <div class="meta-wrap">
        <div class="onair-label"><span>●</span> NOW PLAYING</div>

        <div id="trackTitle" class="track-title">Loading…</div>
        <div id="trackArtist" class="track-artist"></div>
        <div id="trackSub" class="track-sub"></div>

        <div class="controls-block">
          <button id="playButton" class="play-btn">PLAY</button>
          <div class="volume-wrap">
            <input id="volumeBar" class="volume-bar" type="range" min="0" max="100" value="80">
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
/* -------------------------------
   THEME HANDLING (URL + postMessage)
-------------------------------- */
function applyTheme(theme) {
  document.body.classList.remove("theme-light", "theme-dark");

  const t = (theme || "").toLowerCase();

  if (t === "light") {
    document.body.classList.add("theme-light");
  } else if (t === "dark") {
    document.body.classList.add("theme-dark");
  } else {
    document.body.classList.add("theme-dark");
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  applyTheme(params.get("theme"));

  window.addEventListener("message", (event) => {
    if (event.data && event.data.theme) {
      applyTheme(event.data.theme);
    }
  });
});

/* -------------------------------
   STREAM + METADATA
-------------------------------- */
const params = new URLSearchParams(window.location.search);
const streamURL = params.get("stream");
const metaURL = params.get("meta");

const audio = new Audio();
audio.src = streamURL;
audio.preload = "none";
audio.crossOrigin = "anonymous";

const playButton = document.getElementById("playButton");
const volumeBar = document.getElementById("volumeBar");

const titleEl = document.getElementById("trackTitle");
const artistEl = document.getElementById("trackArtist");
const subEl = document.getElementById("trackSub");

const artworkEl = document.getElementById("artwork");
const fallbackChip = document.getElementById("fallbackChip");

playButton.addEventListener("click", () => {
  if (audio.paused) {
    audio.play();
    playButton.textContent = "PAUSE";
  } else {
    audio.pause();
    playButton.textContent = "PLAY";
  }
});

volumeBar.addEventListener("input", () => {
  audio.volume = volumeBar.value / 100;
});

async function fetchMetadata() {
  try {
    const res = await fetch(metaURL + "?_=" + Date.now());
    const data = await res.json();

    const title = data.icestats?.source?.title || "Unknown Title";
    const artist = data.icestats?.source?.artist || "";
    const album = data.icestats?.source?.album || "";

    titleEl.textContent = title;
    artistEl.textContent = artist;
    subEl.textContent = album;

    updateArtwork(title, artist);
  } catch {
    titleEl.textContent = "Unable to load metadata";
  }
}

setInterval(fetchMetadata, 5000);
fetchMetadata();

/* -------------------------------
   ARTWORK
-------------------------------- */
async function updateArtwork(title, artist) {
  const query = encodeURIComponent(`${title} ${artist}`);

  try {
    const res = await fetch(
      `https://itunes.apple.com/search?term=${query}&entity=song&limit=1`
    );
    const data = await res.json();

    if (data.results?.length > 0) {
      let art = data.results[0].artworkUrl100;
      art = art.replace("100x100bb.jpg", "1200x1200bb.jpg");

      artworkEl.src = art;
      fallbackChip.style.display = "none";
    } else {
      showFallback();
    }
  } catch {
    showFallback();
  }
}

function showFallback() {
  artworkEl.src = "";
  fallbackChip.style.display = "block";
}

audio.volume = 0.8;
</script>

</body>
</html>
