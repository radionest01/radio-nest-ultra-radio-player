<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio Nest Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #130f14;
      --accent-orange: #ff9c35;
      --accent-blue: #2f80ed;
      --text-main: #ffffff;
      --text-sub: #ded9e5;
      --text-muted: #a39eb0;
      --error: #ff4b5c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 10% 0%, rgba(255, 190, 130, 0.4), transparent 60%),
        radial-gradient(circle at 85% 100%, rgba(178, 120, 255, 0.35), transparent 60%),
        var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page-wrap {
      width: 100%;
      max-width: 960px;
    }

    /* HEADER – like site masthead, not a box */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 18px;
    }

    .site-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-blue);
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
    }

    .site-sub {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-right {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
    }

    .header-right span {
      color: var(--accent-orange);
      font-weight: 600;
    }

    /* MAIN PLAYER – no container box, just layout */
    .player-main {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      column-gap: 26px;
      align-items: center;
    }

    /* LEFT: album art */
    .art-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 22px 40px rgba(0, 0, 0, 0.8);
    }

    .art-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .art-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 10% 0, rgba(0, 0, 0, 0.25), transparent 60%),
                  linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0.15) 45%, transparent);
      pointer-events: none;
    }

    .fallback-chip {
      position: absolute;
      left: 10px;
      bottom: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* RIGHT: text + controls */
    .right-wrap {
      display: flex;
      flex-direction: column;
    }

    .onair-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .onair-label span {
      color: var(--accent-orange);
      font-weight: 600;
    }

    .track-title {
      font-size: 26px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-main);
      margin-bottom: 4px;
      min-height: 1.2em;
    }

    .track-artist {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-sub);
      margin-bottom: 6px;
      min-height: 1.1em;
    }

    .track-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      column-gap: 16px;
      margin-bottom: 8px;
    }

    .play-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      color: #000000;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.8);
      flex-shrink: 0;
    }

    .play-btn:active {
      transform: translateY(1px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.85);
    }

    .volume-wrap {
      flex: 1;
    }

    .volume-bar {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      outline: none;
      cursor: pointer;
    }

    .volume-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
    }

    .volume-bar::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
    }

    .volume-bar::-moz-range-track {
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      gap: 12px;
    }

    .meta-status.error {
      color: var(--error);
    }

    /* RESPONSIVE */
    @media (max-width: 800px) {
      .player-main {
        grid-template-columns: 1fr;
        row-gap: 18px;
      }

      .art-wrap {
        max-width: 260px;
        margin-bottom: 6px;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 18px;
      }

      .site-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <!-- Header, like "THE MEDIA SITE UK" bar -->
    <header class="site-header">
      <div>
        <button
          class="site-title"
          type="button"
          onclick="window.open('https://myradionest.com', '_blank')"
        >
          Radio Nest Player
        </button>
        <div class="site-sub">RADIO NEST · STREAMING</div>
      </div>
      <div class="header-right">
        <span>On Air</span> Now Playing
      </div>
    </header>

    <!-- Main player area -->
    <main class="player-main">
      <!-- LEFT: Album art -->
      <div class="art-wrap">
        <img
          id="albumArt"
          class="art-img"
          src="https://i.ibb.co/KpygTpfk/Online-Radio-Album-Art-Fall-Back-1.png"
          alt="Album art"
        />
        <div class="art-overlay"></div>
        <div id="fallbackChip" class="fallback-chip">RADIO - LIVE STREAM</div>
      </div>

      <!-- RIGHT: Metadata + controls -->
      <div class="right-wrap">
        <div>
          <div class="onair-label">
            <span>On Air</span> Now Playing
          </div>
          <div id="trackTitle" class="track-title">Loading...</div>
          <div id="trackArtist" class="track-artist"></div>
          <div id="trackSub" class="track-sub">Radio - Live Stream</div>
        </div>

        <div class="controls-row">
          <button id="playBtn" class="play-btn" type="button">Play</button>
          <div class="volume-wrap">
            <input
              id="volumeSlider"
              type="range"
              min="0"
              max="100"
              value="100"
              class="volume-bar"
            />
          </div>
        </div>

        <div class="footer-row">
          <span>Artwork via iTunes Search API</span>
          <span id="metaStatus" class="meta-status">Updating every 15s</span>
        </div>
      </div>
    </main>
  </div>

  <audio id="audioEl"></audio>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const streamUrl = params.get("stream") || "";
      const metaUrl = params.get("meta") || "";

      const audio = document.getElementById("audioEl");
      const playBtn = document.getElementById("playBtn");
      const volumeSlider = document.getElementById("volumeSlider");
      const albumArt = document.getElementById("albumArt");
      const fallbackChip = document.getElementById("fallbackChip");
      const trackTitleEl = document.getElementById("trackTitle");
      const trackArtistEl = document.getElementById("trackArtist");
      const trackSubEl = document.getElementById("trackSub");
      const metaStatusEl = document.getElementById("metaStatus");

      const FALLBACK_ART =
        "https://i.ibb.co/KpygTpfk/Online-Radio-Album-Art-Fall-Back-1.png";
      const FALLBACK_TEXT = "Radio - Live Stream";

      // Stream setup
      if (streamUrl) {
        audio.src = streamUrl;
      }
      audio.volume = 1.0;

      // Play / Pause button (text: Play / Pause)
      playBtn.addEventListener("click", () => {
        if (!audio.src) return;
        if (audio.paused) {
          audio
            .play()
            .then(() => {
              playBtn.textContent = "Pause";
            })
            .catch((err) => console.error("Playback error:", err));
        } else {
          audio.pause();
          playBtn.textContent = "Play";
        }
      });

      audio.addEventListener("play", () => (playBtn.textContent = "Pause"));
      audio.addEventListener("pause", () => (playBtn.textContent = "Play"));

      // Volume
      volumeSlider.addEventListener("input", () => {
        const v = Number(volumeSlider.value || 0);
        audio.volume = Math.min(Math.max(v / 100, 0), 1);
      });

      // Metadata + artwork
      async function fetchMetadata() {
        if (!metaUrl) {
          metaStatusEl.textContent = "No metadata source configured";
          metaStatusEl.classList.add("error");
          return;
        }

        metaStatusEl.textContent = "Updating...";
        metaStatusEl.classList.remove("error");

        try {
          const res = await fetch(metaUrl, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();

          const artist = (data.artist || "").toString().trim();
          const title = (data.title || "").toString().trim();

          if (!artist && !title) {
            trackTitleEl.textContent = "Loading...";
            trackArtistEl.textContent = "";
            trackSubEl.textContent = FALLBACK_TEXT;
            albumArt.src = FALLBACK_ART;
            fallbackChip.style.display = "inline-flex";
            fallbackChip.textContent = "RADIO - LIVE STREAM";
            metaStatusEl.textContent = "No track info in metadata";
            return;
          }

          trackTitleEl.textContent = title || FALLBACK_TEXT;
          trackArtistEl.textContent = artist || "";
          trackSubEl.textContent = FALLBACK_TEXT;

          await updateArtworkFromItunes(artist, title);
          metaStatusEl.textContent = "Updated just now";
        } catch (err) {
          console.error("Metadata error:", err);
          metaStatusEl.textContent = "Metadata error";
          metaStatusEl.classList.add("error");

          if (!trackTitleEl.textContent || trackTitleEl.textContent === "Loading...") {
            trackTitleEl.textContent = FALLBACK_TEXT;
            trackSubEl.textContent = FALLBACK_TEXT;
          }
          albumArt.src = FALLBACK_ART;
          fallbackChip.style.display = "inline-flex";
          fallbackChip.textContent = "RADIO - LIVE STREAM";
        }
      }

      async function updateArtworkFromItunes(artist, title) {
        const query = encodeURIComponent(`${artist} ${title}`.trim());
        if (!query) {
          albumArt.src = FALLBACK_ART;
          fallbackChip.style.display = "inline-flex";
          fallbackChip.textContent = "RADIO - LIVE STREAM";
          return;
        }

        const url = `https://itunes.apple.com/search?media=music&limit=1&term=${query}`;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const json = await res.json();

          if (!json.results || !json.results.length) {
            albumArt.src = FALLBACK_ART;
            fallbackChip.style.display = "inline-flex";
            fallbackChip.textContent = "RADIO - LIVE STREAM";
            return;
          }

          const baseArt =
            json.results[0].artworkUrl100 || json.results[0].artworkUrl60;
          if (!baseArt) {
            albumArt.src = FALLBACK_ART;
            fallbackChip.style.display = "inline-flex";
            fallbackChip.textContent = "RADIO - LIVE STREAM";
            return;
          }

          const hiRes = baseArt.replace(/100x100bb\.jpg|60x60bb\.jpg/, "300x300bb.jpg");
          albumArt.src = hiRes;
          fallbackChip.style.display = "none";
        } catch (err) {
          console.error("Artwork error:", err);
          albumArt.src = FALLBACK_ART;
          fallbackChip.style.display = "inline-flex";
          fallbackChip.textContent = "RADIO - LIVE STREAM";
        }
      }

      if (metaUrl) {
        fetchMetadata();
        setInterval(fetchMetadata, 15000);
      } else {
        metaStatusEl.textContent = "No metadata source configured";
        metaStatusEl.classList.add("error");
      }
    })();
  </script>
</body>
</html>
