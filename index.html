<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio Nest Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at 20% 0%, rgba(255,180,120,0.35), transparent 60%),
                  radial-gradient(circle at 80% 100%, rgba(180,120,255,0.25), transparent 60%),
                  #1a1414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    .player-container {
      width: 720px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand {
      color: #2f80ed;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
      font-size: 14px;
    }

    .onair {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ff9c35;
      font-weight: 600;
    }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 18px;
    }

    .art {
      width: 100%;
      height: 240px;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }

    .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fallback-tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ccc;
    }

    .meta-area {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .meta-header {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ff9c35;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .artist {
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ddd;
      margin-bottom: 10px;
    }

    .fallback-text {
      font-size: 12px;
      color: #aaa;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #fff;
      color: #000;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .volume {
      flex: 1;
    }

    .volume input {
      width: 100%;
    }

    .footer {
      margin-top: 10px;
      font-size: 11px;
      color: #bbb;
      display: flex;
      justify-content: space-between;
    }

    .error {
      color: #ff4b5c;
    }
  </style>
</head>

<body>

<div class="player-container">

  <div class="top-bar">
    <div class="brand" onclick="window.open('https://myradionest.com','_blank')">Radio Nest Player</div>
    <div class="onair">ON AIR • NOW PLAYING</div>
  </div>

  <div class="layout">

    <div class="art">
      <img id="albumArt" src="https://i.ibb.co/KpygTpfk/Online-Radio-Album-Art-Fall-Back-1.png">
      <div id="fallbackTag" class="fallback-tag">Radio - Live Stream</div>
    </div>

    <div class="meta-area">

      <div>
        <div class="meta-header">ON AIR • NOW PLAYING</div>
        <div id="trackTitle" class="title">Loading...</div>
        <div id="trackArtist" class="artist"></div>
        <div id="fallbackText" class="fallback-text">Radio - Live Stream</div>
      </div>

      <div class="controls">
        <button id="playBtn" class="play-btn">Play</button>
        <div class="volume">
          <input id="volumeSlider" type="range" min="0" max="100" value="100">
        </div>
      </div>

      <div class="footer">
        <span>Artwork via iTunes Search API</span>
        <span id="metaStatus">Updating every 15s</span>
      </div>

    </div>

  </div>

</div>

<audio id="audio"></audio>

<script>
(function() {

  const params = new URLSearchParams(window.location.search);
  const stream = params.get("stream") || "";
  const meta = params.get("meta") || "";

  const audio = document.getElementById("audio");
  const playBtn = document.getElementById("playBtn");
  const volumeSlider = document.getElementById("volumeSlider");

  const albumArt = document.getElementById("albumArt");
  const fallbackTag = document.getElementById("fallbackTag");
  const trackTitle = document.getElementById("trackTitle");
  const trackArtist = document.getElementById("trackArtist");
  const fallbackText = document.getElementById("fallbackText");
  const metaStatus = document.getElementById("metaStatus");

  const FALLBACK_ART = "https://i.ibb.co/KpygTpfk/Online-Radio-Album-Art-Fall-Back-1.png";
  const FALLBACK_TEXT = "Radio - Live Stream";

  audio.src = stream;
  audio.volume = 1.0;

  playBtn.addEventListener("click", () => {
    if (audio.paused) {
      audio.play();
      playBtn.textContent = "Stop";
    } else {
      audio.pause();
      playBtn.textContent = "Play";
    }
  });

  volumeSlider.addEventListener("input", () => {
    audio.volume = volumeSlider.value / 100;
  });

  async function updateMetadata() {
    if (!meta) {
      metaStatus.textContent = "No metadata source configured";
      metaStatus.classList.add("error");
      return;
    }

    metaStatus.textContent = "Updating...";

    try {
      const res = await fetch(meta, { cache: "no-store" });
      const data = await res.json();

      const artist = data.artist || "";
      const title = data.title || "";

      if (!artist && !title) {
        trackTitle.textContent = FALLBACK_TEXT;
        trackArtist.textContent = "";
        fallbackText.textContent = FALLBACK_TEXT;
        albumArt.src = FALLBACK_ART;
        fallbackTag.style.display = "block";
        return;
      }

      trackTitle.textContent = title;
      trackArtist.textContent = artist;
      fallbackText.textContent = FALLBACK_TEXT;
      fallbackTag.style.display = "none";

      await updateArtwork(artist, title);

      metaStatus.textContent = "Updated just now";

    } catch (e) {
      metaStatus.textContent = "Metadata error";
      metaStatus.classList.add("error");
      albumArt.src = FALLBACK_ART;
      fallbackTag.style.display = "block";
    }
  }

  async function updateArtwork(artist, title) {
    const query = encodeURIComponent(`${artist} ${title}`);
    const url = `https://itunes.apple.com/search?media=music&limit=1&term=${query}`;

    try {
      const res = await fetch(url);
      const json = await res.json();

      if (!json.results.length) {
        albumArt.src = FALLBACK_ART;
        fallbackTag.style.display = "block";
        return;
      }

      const art = json.results[0].artworkUrl100.replace("100x100bb.jpg", "300x300bb.jpg");
      albumArt.src = art;
      fallbackTag.style.display = "none";

    } catch {
      albumArt.src = FALLBACK_ART;
      fallbackTag.style.display = "block";
    }
  }

  updateMetadata();
  setInterval(updateMetadata, 15000);

})();
</script>

</body>
</html>
