<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio Nest Player</title>

<style>
/* --- CSS (inline) --- */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at top,#f2d7d0 0%,#3e2c2a 55%,#1a1414 100%);
  color:#fff;min-height:100vh;display:flex;align-items:stretch;
}
.player-page{
  width:100%;max-width:1100px;margin:32px auto;padding:24px 32px;
  background:rgba(10,6,6,0.8);border-radius:18px;backdrop-filter:blur(10px);
  box-shadow:0 24px 60px rgba(0,0,0,0.6);
}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.brand{
  letter-spacing:.25em;font-size:14px;text-transform:uppercase;
  font-weight:700;text-decoration:none;color:#4da3ff;
  transition:opacity .2s ease;
}
.brand:hover{opacity:.8}

.player-layout{display:grid;grid-template-columns:1.1fr 1.2fr;gap:40px}
.artwork-card{
  background:linear-gradient(145deg,#362225,#74433a);border-radius:18px;
  padding:16px;box-shadow:0 18px 40px rgba(0,0,0,0.7);
}
.artwork-img{width:100%;border-radius:12px;display:block}
.artwork-text{margin-top:14px}
.artist-name{text-transform:uppercase;letter-spacing:.18em;opacity:.8;font-size:14px}
.album-title{font-size:20px;font-weight:600;margin-top:4px}

.info-section{display:flex;flex-direction:column;justify-content:center}
.now-playing-label{
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#f6cbb0;margin-bottom:10px
}
.track-title{
  font-size:40px;font-weight:700;text-transform:uppercase;letter-spacing:.08em
}
.track-artist{margin-top:8px;font-size:18px;opacity:.8}

.controls-row{display:flex;align-items:center;gap:24px;margin-top:28px}
.primary-btn{
  border:none;border-radius:999px;padding:12px 38px;font-size:14px;
  letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  background:linear-gradient(135deg,#f5b98a,#f0764b);color:#1b0f0d;cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,0.6);transition:.08s ease;
}
.primary-btn:hover{transform:translateY(-1px);opacity:.95}
.primary-btn:active{transform:translateY(1px)}

.volume-wrapper{display:flex;flex-direction:column;gap:6px;font-size:12px;opacity:.9}
#volumeSlider{width:180px}

input[type=range]{-webkit-appearance:none;height:4px;background:rgba(255,255,255,.25);
  border-radius:999px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#f5b98a;border:2px solid #1b0f0d;margin-top:-6px
}

@media(max-width:800px){
  .player-page{margin:0;border-radius:0;min-height:100vh}
  .player-layout{grid-template-columns:1fr;gap:24px}
  .track-title{font-size:28px}
}
</style>
</head>

<body>
<div class="player-page">

  <header class="top-bar">
    <a href="https://myradionest.com" target="_blank" class="brand">RADIO NEST</a>
  </header>

  <main class="player-layout">

    <!-- Artwork -->
    <section class="artwork-section">
      <div class="artwork-card">
        <img id="albumArt"
             src="https://i.ibb.co/KpygTpfk/Online-Radio-Album-Art-Fall-Back-1.png"
             class="artwork-img" />
        <div class="artwork-text">
          <div class="artist-name" id="albumArtistLabel">Radio</div>
          <div class="album-title" id="albumTitleLabel">Live Stream</div>
        </div>
      </div>
    </section>

    <!-- Info + controls -->
    <section class="info-section">
      <div class="now-playing-label">ON AIR NOW</div>
      <div class="now-playing-main">
        <div class="track-title" id="trackTitle">Radio</div>
        <div class="track-artist" id="trackArtist"></div>
      </div>

      <div class="controls-row">
        <button id="playPauseBtn" class="primary-btn">PLAY</button>
        <div class="volume-wrapper">
          <label for="volumeSlider">Volume</label>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" />
        </div>
      </div>
    </section>

  </main>

  <audio id="audioPlayer"></audio>

</div>

<script>
/* --- JavaScript (inline) --- */

// Read URL parameters
const params = new URLSearchParams(window.location.search);
const streamUrl = params.get("stream");
const metaUrl = params.get("meta");

// DOM elements
const audio = document.getElementById("audioPlayer");
const playPauseBtn = document.getElementById("playPauseBtn");
const volumeSlider = document.getElementById("volumeSlider");
const trackTitle = document.getElementById("trackTitle");
const trackArtist = document.getElementById("trackArtist");
const albumArt = document.getElementById("albumArt");
const albumArtistLabel = document.getElementById("albumArtistLabel");
const albumTitleLabel = document.getElementById("albumTitleLabel");

// Fallbacks
const FALLBACK_TITLE = "Radio";
const FALLBACK_ART = "https://i.ibb.co/KpygTpfk/Online-Radio-Album-Art-Fall-Back-1.png";

// Set stream
if (streamUrl) audio.src = streamUrl;

// Volume
audio.volume = parseFloat(volumeSlider.value);
volumeSlider.addEventListener("input", () => {
  audio.volume = parseFloat(volumeSlider.value);
});

// Play/pause
playPauseBtn.addEventListener("click", async () => {
  if (audio.paused) {
    await audio.play();
    playPauseBtn.textContent = "PAUSE";
  } else {
    audio.pause();
    playPauseBtn.textContent = "PLAY";
  }
});

// Fallback function
function applyFallback() {
  trackTitle.textContent = FALLBACK_TITLE;
  trackArtist.textContent = "";
  albumArtistLabel.textContent = FALLBACK_TITLE;
  albumTitleLabel.textContent = "Live Stream";
  albumArt.src = FALLBACK_ART;
}

// Metadata fetch
async function updateMetadata() {
  if (!metaUrl) return applyFallback();

  try {
    const res = await fetch(metaUrl);
    const data = await res.json();

    const title = (data.title || data.song || "").trim();
    const artist = (data.artist || data.performer || "").trim();

    if (!title && !artist) return applyFallback();

    trackTitle.textContent = title || FALLBACK_TITLE;
    trackArtist.textContent = artist || "";
    albumArtistLabel.textContent = artist || FALLBACK_TITLE;
    albumTitleLabel.textContent = title || FALLBACK_TITLE;

    // iTunes lookup
    const searchTerm = encodeURIComponent(`${artist} ${title}`.trim());
    const itunesRes = await fetch(`https://itunes.apple.com/search?term=${searchTerm}&limit=1`);
    const itunesData = await itunesRes.json();

    if (itunesData.results.length > 0) {
      const art = itunesData.results[0].artworkUrl100.replace("100x100", "600x600");
      albumArt.src = art;
    } else {
      albumArt.src = FALLBACK_ART;
    }

  } catch (e) {
    applyFallback();
  }
}

updateMetadata();
setInterval(updateMetadata, 30000);
</script>

</body>
</html>
